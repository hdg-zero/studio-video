[project]
name = "studio-audio"
version = "1.0.0"
description = "Audio du studio vidéo : musique synthétisée selon les ambiances, mixage sous la voix, contrôle de voix."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
studio-audio = "studio_audio.cli:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639: SPDX license string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "NPY", "PERF"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["studio_audio"]
